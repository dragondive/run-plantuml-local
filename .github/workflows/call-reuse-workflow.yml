name: Call Reuse Workflow Experiment
on:
  workflow_dispatch:


jobs:
  call-reuse-workflow:
    uses: ./.github/workflows/reuse-workflow.yml
    with:
      who: "Workaround"

  create-reuse-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        run: uv python install

      - name: Create reuse workflow
        shell: bash
        run: |
          cd ${GITHUB_WORKSPACE}/.github/workflows
          uv run create_test.py
          ls -laR

      - name: Run reuse workflow
        uses: ./.github/workflows/test-reuse.yml
