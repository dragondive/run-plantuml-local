env:
  GH_TOKEN: ${{ github.token }}
  diagram-data-path: .github/workflows/plantuml/diagram-data.json
  diagram-source-path: .github/workflows/plantuml/diagram.puml
  output-filename: test_plantuml
jobs:
  macos-14-1_2025_3-cli-arguments-processed:
    name: '[macos-14, 1.2025.3]-CLI arguments processed'
    runs-on: macos-14
    steps:
    - if: ${{ always() }}
      name: Report 'pending' status to the trigger SHA
      run: 'gh api repos/${{ github.repository }}/statuses/${{ inputs.trigger_sha}}
        --field state=pending --field context="macos-14-1.2025.3-cli-arguments-processed
        (dynamic-test)" --field description="macos-14-1.2025.3-cli-arguments-processed
        (dynamic-test) status: pending status: pending" '
    - name: Checkout dynamic workflow
      uses: actions/checkout@v5.0.0
      with:
        ref: ${{ github.event.workflow_dispatch.inputs.ref }}
        token: ${{ secrets.PAT_ACTIONS }}
    - name: Run plantuml
      uses: ./
      with:
        cache-plantuml-jar: false
        cli-arguments: -tsvg -noerror -Dinput_data_file=${{ github.workspace }}/${{
          env.diagram-data-path }} -Doutput_filename=${{ env.output-filename }} -o
          ${{ github.workspace }} ${{ github.workspace }}/${{ env.diagram-source-path
          }}
        jvm-options: ''
        version: 1.2025.3
    - id: result
      name: Check result
      run: "\n                            if ! [ -f '${{ github.workspace }}/${{ env.output-filename\
        \ }}.svg' ];\n                            then\n                         \
        \       echo \"::error::Diagram file not found.\"\n                      \
        \          exit 1\n                            fi\n\n                    \
        \        if [ \"$(awk 'BEGIN {count=0}                                   \
        \  /Hello Alice!/ && /Hello Bob!/ {++count}                              \
        \       END {print count}' 2>/dev/null                                   \
        \  '${{ github.workspace}}/${{ env.output-filename }}.svg')\" -ne 1 ];\n \
        \                           then\n                                echo \"\
        ::error::Diagram not created correctly.\"\n                              \
        \  exit 1\n                            fi\n                        "
      shell: bash
    - if: ${{ always() }}
      name: Report '${{ steps.result.outcome }}' status to the trigger SHA
      run: 'gh api repos/${{ github.repository }}/statuses/${{ inputs.trigger_sha}}
        --field state=${{ steps.result.outcome }} --field context="macos-14-1.2025.3-cli-arguments-processed
        (dynamic-test)" --field description="macos-14-1.2025.3-cli-arguments-processed
        (dynamic-test) status: ${{ steps.result.outcome }} status: ${{ steps.result.outcome
        }}" '
  macos-14-1_2025_3-jvm-arguments-processed:
    name: '[macos-14, 1.2025.3]-JVM arguments processed'
    runs-on: macos-14
    steps:
    - if: ${{ always() }}
      name: Report 'pending' status to the trigger SHA
      run: 'gh api repos/${{ github.repository }}/statuses/${{ inputs.trigger_sha}}
        --field state=pending --field context="macos-14-1.2025.3-jvm-arguments-processed
        (dynamic-test)" --field description="macos-14-1.2025.3-jvm-arguments-processed
        (dynamic-test) status: pending status: pending" '
    - name: Checkout dynamic workflow
      uses: actions/checkout@v5.0.0
      with:
        ref: ${{ github.event.workflow_dispatch.inputs.ref }}
        token: ${{ secrets.PAT_ACTIONS }}
    - name: Run plantuml
      uses: ./
      with:
        cache-plantuml-jar: false
        cli-arguments: -tpng -noerror -nometadata -Dinput_data_file=${{ github.workspace
          }}/${{ env.diagram-data-path }} -Doutput_filename=${{ env.output-filename
          }} -o ${{ github.workspace }} ${{ github.workspace }}/${{ env.diagram-source-path
          }}
        jvm-options: -DPLANTUML_LIMIT_SIZE=1
        version: 1.2025.3
    - id: result
      name: Check result
      run: "\n                            if ! [ -f '${{ github.workspace }}/${{ env.output-filename\
        \ }}.png' ];\n                            then\n                         \
        \       echo \"::error::Diagram file not found.\"\n                      \
        \          exit 1\n                            fi\n\n                    \
        \        IMAGE_FILE_SIZE=\"$(ls -s                                 '${{ github.workspace\
        \ }}/${{ env.output-filename }}.png'                                 | awk\
        \ '{print $1}')\"\n                            THRESHOLD_SIZE=200\n      \
        \                      if [ \"$IMAGE_FILE_SIZE\" -lt 1 ]                 \
